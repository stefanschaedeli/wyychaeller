# For Synology Container Manager: Projekt → Erstellen → this file.
# Put ANTHROPIC_API_KEY (or GEMINI_API_KEY plus WINE_INTELLIGENCE_MODE=gemini) into a file named ".env" in the same project folder.
# The image is built by GitHub Actions (.github/workflows/release-image.yml) and published as a
# public package on ghcr.io, so the NAS needs no registry login (see README section 5).
services:
  weinkeller:
    image: ghcr.io/stefanschaedeli/wyychaeller:latest
    container_name: weinkeller
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      WINE_INTELLIGENCE_MODE: ${WINE_INTELLIGENCE_MODE:-claude}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /volume1/docker/weinkeller/data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
